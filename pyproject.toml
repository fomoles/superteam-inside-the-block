[project]
name = "inside-the-block"
version = "0.1.0"
description = "Measure how Solana mainnet leaders order transactions inside a block"
readme = "README.md"
authors = [
    { name = "fomoles", email = "261663050+fomoles@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aioquic>=1.7.0",
    "base58>=2.1.1",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "solders>=0.29.0",
    "tabulate>=0.10.0",
    "websockets>=17.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
